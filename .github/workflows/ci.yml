name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Lint contracts
        run: cargo clippy --manifest-path contracts/Cargo.toml

      - name: Test contracts
        run: cargo test --manifest-path contracts/Cargo.toml

      - name: Build contract Wasm
        run: cargo build --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://user:password@host:5432/database?sslmode=require
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_EXPLORER_BASE_URL: https://stellar.expert/explorer/testnet

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://user:password@host:5432/database?sslmode=require
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_EXPLORER_BASE_URL: https://stellar.expert/explorer/testnet

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@host:5432/database?sslmode=require
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_EXPLORER_BASE_URL: https://stellar.expert/explorer/testnet
